<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CryptoMiner Owner</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

  <h1>👑 CryptoMiner Owner</h1>

  <div id="status">
    Checking Telegram...
  </div>

  <div id="panel" style="display:none;">

    <h2>Admin Panel</h2>

    <p>
      Role:
      <strong id="role"></strong>
    </p>

    <p>
      Telegram ID:
      <strong id="telegramId"></strong>
    </p>

  </div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


const SUPABASE_URL =
  "https://mledptrviyvodbophaph.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Qn97tJVNRfMAANxyuDVjvw_D-XiAmYA";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function checkOwner(){

  const status = document.getElementById("status");
  const panel = document.getElementById("panel");

  if(!tg.initDataUnsafe.user){

    status.textContent =
      "❌ Telegram user not found.";

    return;
  }

  const telegramId =
    String(tg.initDataUnsafe.user.id);

  console.log("TELEGRAM ID:", telegramId);

  const { data, error } =
    await supabaseClient
      .from("admin_users")
      .select("telegram_id, role")
      .eq("telegram_id", telegramId)
      .maybeSingle();

  console.log("ADMIN DATA:", data);
  console.log("ADMIN ERROR:", error);

  if(error){

    status.textContent =
      "❌ " + error.message;

    return;
  }

  if(!data){

    status.textContent =
      "❌ Access denied. Telegram ID: " + telegramId;

    return;
  }

  status.textContent =
    "✅ Access granted";

  document.getElementById("role").textContent =
    data.role;

  document.getElementById("telegramId").textContent =
    data.telegram_id;

  panel.style.display = "block";
}


checkOwner();

</script>

</body>

</html>
