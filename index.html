<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Crystal Platform</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,#172554 0,#070b18 45%,#03050b 100%);
  color:white;
  padding-bottom:85px;
  overflow-x:hidden;
}

.app{
  max-width:520px;
  margin:auto;
  padding:22px 16px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:.5px;
}

.lang{
  background:#111827;
  border:1px solid #29344d;
  border-radius:12px;
  padding:8px 11px;
  color:white;
}

.card{
  background:rgba(15,23,42,.85);
  border:1px solid #26334e;
  border-radius:22px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
  backdrop-filter:blur(12px);
}

.balance-title{
  color:#94a3b8;
  font-size:13px;
}

.balance{
  font-size:38px;
  font-weight:800;
  margin:8px 0 20px;
}

.buttons{
  display:flex;
  gap:10px;
}

button{
  border:0;
  color:white;
  cursor:pointer;
}

.action{
  flex:1;
  padding:14px;
  border-radius:15px;
  background:#1d4ed8;
  font-weight:700;
}

.action.withdraw{
  background:#334155;
}

.section-title{
  font-size:25px;
  font-weight:800;
  margin-bottom:18px;
}

.miner-box{
  text-align:center;
  padding:25px 10px;
  position:relative;
}

.crystal{
  font-size:75px;
  margin:10px;
  display:inline-block;
  filter:drop-shadow(0 0 18px rgba(96,165,250,.45));
  transition:.2s;
}

.crystal.hit{
  animation:crystalHit .35s ease;
}

@keyframes crystalHit{
  0%{transform:scale(1) rotate(0)}
  40%{transform:scale(1.25) rotate(-8deg)}
  70%{transform:scale(.9) rotate(8deg)}
  100%{transform:scale(1) rotate(0)}
}

.count{
  font-size:27px;
  font-weight:800;
}

.sub{
  color:#94a3b8;
  margin-top:7px;
}

.mine-buttons{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:25px;
}

.mine-btn{
  padding:17px;
  border-radius:17px;
  font-size:16px;
  font-weight:800;
  background:#2563eb;
  box-shadow:0 8px 25px rgba(37,99,235,.25);
  transition:.15s;
}

.mine-btn:active{
  transform:scale(.96);
}

.mine-btn.auto{
  background:#7c3aed;
  box-shadow:0 8px 25px rgba(124,58,237,.25);
}

.progress{
  height:10px;
  background:#1e293b;
  border-radius:10px;
  overflow:hidden;
  margin-top:18px;
}

.progress-fill{
  height:100%;
  width:0%;
  background:#60a5fa;
  transition:.35s;
  box-shadow:0 0 15px rgba(96,165,250,.7);
}

.notice{
  padding:14px;
  background:#172033;
  border-radius:14px;
  color:#cbd5e1;
  font-size:13px;
  margin-top:15px;
}

.countdown{
  display:none;
  margin-top:18px;
  padding:15px;
  border-radius:17px;
  background:rgba(30,41,59,.8);
  border:1px solid #334155;
}

.countdown.active{
  display:block;
}

.countdown-label{
  color:#94a3b8;
  font-size:12px;
  margin-bottom:5px;
}

.countdown-time{
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
}

.plus{
  position:absolute;
  left:50%;
  top:35px;
  transform:translateX(-50%);
  color:#60a5fa;
  font-size:25px;
  font-weight:900;
  pointer-events:none;
  animation:plusFloat .7s ease forwards;
}

@keyframes plusFloat{
  0%{
    opacity:1;
    transform:translate(-50%,0) scale(1);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-70px) scale(1.25);
  }
}

.particle{
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#60a5fa;
  pointer-events:none;
  animation:particleFly .7s ease forwards;
}

@keyframes particleFly{
  0%{
    opacity:1;
    transform:translate(0,0) scale(1);
  }
  100%{
    opacity:0;
    transform:translate(var(--x),var(--y)) scale(.2);
  }
}

.profile{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.avatar{
  width:65px;
  height:65px;
  border-radius:50%;
  background:#1e3a8a;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
}

.info{
  line-height:1.8;
}

.info span{
  color:#94a3b8;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:75px;
  background:rgba(3,7,18,.96);
  border-top:1px solid #1e293b;
  display:flex;
  justify-content:center;
  z-index:20;
}

.nav{
  width:100%;
  max-width:520px;
  display:flex;
  justify-content:space-around;
}

.nav button{
  background:none;
  color:#64748b;
  font-size:13px;
  width:33%;
}

.nav button.active{
  color:#60a5fa;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.success{
  color:#4ade80;
}

.error{
  color:#f87171;
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="logo">💎 CRYSTAL</div>

    <select class="lang" id="language">
      <option value="tk">🇹🇲 TM</option>
      <option value="ru">🇷🇺 RU</option>
      <option value="en">🇬🇧 EN</option>
    </select>
  </div>


  <!-- WALLET -->
  <section id="wallet" class="page active">

    <div class="card">

      <div class="balance-title">
        Balance
      </div>

      <div class="balance">
        $<span id="balance">0.00</span>
      </div>

      <div class="buttons">

        <button class="action" onclick="deposit()">
          💵 <span>Pul sal</span>
        </button>

        <button class="action withdraw" onclick="withdraw()">
          💸 <span>Pul çykar</span>
        </button>

      </div>

    </div>


    <div class="card">

      <div class="section-title">💎 Miner</div>

      <div class="miner-box">

        <div class="crystal">💎</div>

        <div class="count">
          <span id="crystals">0</span> / 100
        </div>

        <div class="sub">
          Gündelik limit
        </div>

        <div class="progress">
          <div class="progress-fill" id="progress"></div>
        </div>

      </div>

    </div>

  </section>


  <!-- MINER -->
  <section id="miner" class="page">

    <div class="section-title">💎 Miner</div>

    <div class="card">

      <div class="miner-box" id="minerBox">

        <div class="crystal" id="bigCrystal">
          💎
        </div>

        <div class="count">
          <span id="minerCount">0</span> / 100
        </div>

        <div class="sub">
          Gündelik miner limiti
        </div>

        <div class="progress">
          <div class="progress-fill" id="minerProgress"></div>
        </div>

        <div class="countdown" id="countdown">

          <div class="countdown-label">
            🤖 Awtomat işleýär
          </div>

          <div class="countdown-time" id="countdownTime">
            10:00
          </div>

        </div>

        <div class="mine-buttons">

          <button class="mine-btn" onclick="manualMine()">
            ⛏️ EL BILEN
          </button>

          <button class="mine-btn auto" onclick="autoMine()">
            🤖 AWTOMAT
          </button>

        </div>

        <div class="notice" id="minerNotice">
          Häzirki test režimi
        </div>

      </div>

    </div>

  </section>


  <!-- PROFILE -->
  <section id="profile" class="page">

    <div class="section-title">👤 Profil</div>

    <div class="card">

      <div class="profile">

        <div class="avatar" id="avatar">
          👤
        </div>

        <div class="info">

          <div>
            <span>Ady:</span>
            <b id="userName">Test User</b>
          </div>

          <div>
            <span>Telegram ID:</span>
            <b id="telegramId">Test</b>
          </div>

          <div>
            <span>Username:</span>
            <b id="username">@test</b>
          </div>

        </div>

      </div>

      <div class="notice" id="profileStatus">
        User maglumatlary ýüklenýär...
      </div>

    </div>


    <div class="card">

      <div class="section-title">🌐 Dil</div>

      <p style="color:#94a3b8">
        Dili ýokardaky menýudan üýtgedip bilersiňiz.
      </p>

    </div>

  </section>

</div>


<!-- BOTTOM NAV -->

<div class="bottom">

  <div class="nav">

    <button id="navWallet" class="active"
      onclick="showPage('wallet',this)">
      💰<br>Gapjyk
    </button>

    <button onclick="showPage('miner',this)">
      💎<br>Miner
    </button>

    <button onclick="showPage('profile',this)">
      👤<br>Profil
    </button>

  </div>

</div>


<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
}


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://mledptrviyvodbophaph.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Qn97tJVNRfMAANxyuDVjvw_D-XiAmYA";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   USER
========================================================= */

let telegramUser = null;
let currentUser = null;


/* =========================================================
   TEST DATA
========================================================= */

let balance = 0;
let crystals = 0;

let autoTimer = null;
let countdownTimer = null;
let autoEndTime = null;

let autoStartTime = null;
let autoStartCrystals = 0;
let autoDurationSeconds = 0;


/* =========================================================
   PAGE
========================================================= */

function showPage(page,button){

  document.querySelectorAll('.page')
    .forEach(p => p.classList.remove('active'));

  document.getElementById(page)
    .classList.add('active');

  document.querySelectorAll('.nav button')
    .forEach(b => b.classList.remove('active'));

  button.classList.add('active');
}


/* =========================================================
   TELEGRAM USER
========================================================= */

function loadTelegramUser(){

  if(
    tg &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user
  ){

    telegramUser =
      tg.initDataUnsafe.user;

  }else{

    telegramUser = {
      id: "TEST_" + Date.now(),
      first_name: "Test",
      last_name: "User",
      username: "test_user"
    };

  }

}


/* =========================================================
   LOAD / CREATE USER
========================================================= */

async function loadUser(){

  if(!telegramUser) return;

  document.getElementById('userName').innerText =
    (
      (telegramUser.first_name || '') +
      ' ' +
      (telegramUser.last_name || '')
    ).trim();

  document.getElementById('telegramId').innerText =
    telegramUser.id;

  document.getElementById('username').innerText =
    telegramUser.username
      ? '@' + telegramUser.username
      : 'Ýok';


  const { data, error } =
    await supabaseClient
      .from('users')
      .select('*')
      .eq('telegram_id', String(telegramUser.id))
      .limit(1)
      .maybeSingle();


  if(error){

    console.error('USER LOAD ERROR:', error);

    document.getElementById('profileStatus').innerText =
      '❌ ' + (error.message || 'Supabase error');

    return;

  }


  if(data){

    currentUser = data;

    crystals =
      Number(data.crystals || 0);

    updateMiner();

    document.getElementById('profileStatus').innerText =
      '✅ Account maglumatlary ýüklenildi.';

    return;

  }


  /*
    Täze user.
    id int8 bolany üçin häzirki wagtda
    frontend özboluşly san berýär.
  */

  const newUser = {

    id:
      Date.now(),

    telegram_id:
      String(telegramUser.id),

    first_name:
      telegramUser.first_name || '',

    last_name:
      telegramUser.last_name || '',

    username:
      telegramUser.username || '',

    language:
      localStorage.getItem('language') || 'tk',

    crystals:
      0

  };


  const result =
    await supabaseClient
      .from('users')
      .insert(newUser)
      .select()
      .single();


  if(result.error){

    console.error('USER INSERT ERROR:', result.error);

    document.getElementById('profileStatus').innerText =
      '❌ ' + (result.error.message || 'User database-e ýazylmady.');

    return;

  }


  currentUser = result.data;

  crystals = 0;

  updateMiner();

  document.getElementById('profileStatus').innerText =
    '✅ Täze account döredildi.';

}


/* =========================================================
   SAVE CRYSTALS
========================================================= */

async function saveCrystals(){

  if(!currentUser || !telegramUser) return;

  const { error } =
    await supabaseClient
      .from('users')
      .update({
        crystals: crystals,
        updated_at: new Date().toISOString()
      })
      .eq('telegram_id', String(telegramUser.id));


  if(error){

    console.error('CRYSTAL SAVE ERROR:', error);

    document.getElementById('profileStatus').innerText =
      '⚠️ Crystal save error: ' +
      (error.message || 'Unknown error');

  }

}


/* =========================================================
   MANUAL MINER
========================================================= */

async function manualMine(){

  if(crystals >= 100){

    document.getElementById('minerNotice').innerText =
      'Bugünlik 100 limit doldy. Ertir täzeden açylar.';

    return;

  }


  crystals++;

  playMiningEffect();

  updateMiner();

  await saveCrystals();

}


/* =========================================================
   AUTO MINER
========================================================= */

function autoMine(){

  if(autoTimer){

    clearTimeout(autoTimer);
    autoTimer = null;

    clearInterval(countdownTimer);
    countdownTimer = null;

    autoEndTime = null;

    document.getElementById('countdown')
      .classList.remove('active');

    document.getElementById('minerNotice').innerText =
      'Awtomat duruzdy.';

    return;

  }


  if(crystals >= 100){

    document.getElementById('minerNotice').innerText =
      'Bugünlik limit doldy.';

    return;

  }


  autoDurationSeconds =
    Math.floor(Math.random() * 121) + 540;


  autoStartTime =
    Date.now();

  autoEndTime =
    autoStartTime +
    autoDurationSeconds * 1000;

  autoStartCrystals =
    crystals;


  document.getElementById('countdown')
    .classList.add('active');

  document.getElementById('minerNotice').innerText =
    '🤖 Awtomat işleýär...';


  updateAutoProgress();


  countdownTimer =
    setInterval(
      updateAutoProgress,
      1000
    );


  autoTimer =
    setTimeout(
      finishAutoMining,
      autoDurationSeconds * 1000
    );

}


/* =========================================================
   AUTO PROGRESS
========================================================= */

async function updateAutoProgress(){

  if(!autoEndTime) return;


  const now =
    Date.now();

  const remaining =
    Math.max(
      0,
      autoEndTime - now
    );


  const elapsed =
    Math.min(
      autoDurationSeconds * 1000,
      now - autoStartTime
    );


  const totalGain =
    100 - autoStartCrystals;


  const gained =
    Math.floor(
      (elapsed / (autoDurationSeconds * 1000))
      * totalGain
    );


  const newCrystalValue =
    Math.min(
      100,
      autoStartCrystals + gained
    );


  if(newCrystalValue > crystals){

    crystals =
      newCrystalValue;

    updateMiner();

    playMiningEffect();

    await saveCrystals();

  }


  const totalSeconds =
    Math.ceil(
      remaining / 1000
    );


  const minutes =
    Math.floor(
      totalSeconds / 60
    );


  const seconds =
    totalSeconds % 60;


  document.getElementById('countdownTime')
    .innerText =
      String(minutes).padStart(2,'0') +
      ':' +
      String(seconds).padStart(2,'0');

}


/* =========================================================
   AUTO FINISH
========================================================= */

async function finishAutoMining(){

  clearInterval(countdownTimer);

  countdownTimer = null;
  autoTimer = null;

  autoEndTime = null;

  crystals = 100;

  updateMiner();

  await saveCrystals();

  document.getElementById('countdownTime')
    .innerText = '00:00';

  document.getElementById('minerNotice').innerText =
    '🎉 Awtomat tamamlandy! 100/100 boldy. Ertir täzeden açylar.';

  playCompletionEffect();

  setTimeout(() => {

    document.getElementById('countdown')
      .classList.remove('active');

  },1500);

}


/* =========================================================
   MINER UPDATE
========================================================= */

function updateMiner(){

  document.getElementById('crystals').innerText =
    crystals;

  document.getElementById('minerCount').innerText =
    crystals;

  document.getElementById('progress').style.width =
    crystals + '%';

  document.getElementById('minerProgress').style.width =
    crystals + '%';

}


/* =========================================================
   MINING EFFECT
========================================================= */

function playMiningEffect(){

  const crystal =
    document.getElementById('bigCrystal');

  crystal.classList.remove('hit');

  void crystal.offsetWidth;

  crystal.classList.add('hit');


  const plus =
    document.createElement('div');

  plus.className = 'plus';
  plus.innerText = '+1 💎';

  document.getElementById('minerBox')
    .appendChild(plus);


  setTimeout(
    () => plus.remove(),
    700
  );


  for(let i=0;i<8;i++){

    const particle =
      document.createElement('div');

    particle.className = 'particle';

    particle.style.left = '50%';
    particle.style.top = '60px';

    particle.style.setProperty(
      '--x',
      ((Math.random()*120)-60)+'px'
    );

    particle.style.setProperty(
      '--y',
      ((Math.random()*100)-50)+'px'
    );

    document.getElementById('minerBox')
      .appendChild(particle);

    setTimeout(
      () => particle.remove(),
      700
    );

  }

}


/* =========================================================
   COMPLETION EFFECT
========================================================= */

function playCompletionEffect(){

  const crystal =
    document.getElementById('bigCrystal');

  crystal.style.transform =
    'scale(1.35)';

  crystal.style.filter =
    'drop-shadow(0 0 35px rgba(96,165,250,.95))';


  setTimeout(()=>{

    crystal.style.transform =
      'scale(1)';

    crystal.style.filter =
      'drop-shadow(0 0 18px rgba(96,165,250,.45))';

  },700);


  for(let i=0;i<20;i++){

    const particle =
      document.createElement('div');

    particle.className = 'particle';

    particle.style.left = '50%';
    particle.style.top = '60px';

    particle.style.setProperty(
      '--x',
      ((Math.random()*240)-120)+'px'
    );

    particle.style.setProperty(
      '--y',
      ((Math.random()*180)-90)+'px'
    );

    document.getElementById('minerBox')
      .appendChild(particle);

    setTimeout(
      () => particle.remove(),
      800
    );

  }

}


/* =========================================================
   DEPOSIT
========================================================= */

function deposit(){

  alert(
    'TEST: Pul salmak bölümi. Crypto payment indiki tapgyrda goşular.'
  );

}


/* =========================================================
   WITHDRAW
========================================================= */

function withdraw(){

  alert(
    'TEST: Pul çykarmak bölümi. Minimum $50 we admin tassyklamasy indiki tapgyrda goşular.'
  );

}


/* =========================================================
   LANGUAGE
========================================================= */

const languageSelect =
  document.getElementById('language');


const savedLanguage =
  localStorage.getItem('language');


if(savedLanguage){

  languageSelect.value =
    savedLanguage;

}


languageSelect.addEventListener(
  'change',
  function(){

    localStorage.setItem(
      'language',
      this.value
    );

  }
);


/* =========================================================
   START
========================================================= */

async function startApp(){

  loadTelegramUser();

  await loadUser();

  updateMiner();

}


startApp();

</script>

</body>
</html>
