<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Crystal Miner</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 15%, #29456f 0%, #111c31 38%, #060a12 100%);
}

.app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
    padding: 28px 20px;
    position: relative;
}

.screen {
    min-height: calc(100vh - 56px);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.hidden {
    display: none !important;
}

/* HOME */

.logo {
    font-size: 45px;
    filter: drop-shadow(0 0 18px #55e8ff);
    margin-top: 15px;
}

.title {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 3px;
    margin-top: 7px;
}

.subtitle {
    color: #8ea2c5;
    margin-top: 8px;
    font-size: 14px;
}

.bigCrystal {
    margin-top: 65px;
    font-size: 125px;
    filter:
        drop-shadow(0 0 10px #53ddff)
        drop-shadow(0 0 35px #287eff);
    animation: floating 3s ease-in-out infinite;
}

@keyframes floating {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

.modeButtons {
    width: 100%;
    margin-top: 55px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

button {
    border: 0;
    width: 100%;
    padding: 19px;
    border-radius: 18px;
    color: white;
    font-size: 18px;
    font-weight: 800;
    background: linear-gradient(135deg,#2868e8,#7138dc);
    box-shadow: 0 10px 30px rgba(45,100,230,.35);
    touch-action: manipulation;
}

button:active {
    transform: scale(.95);
}

.autoButton {
    background: linear-gradient(135deg,#078b77,#16c6a1);
    box-shadow: 0 10px 30px rgba(20,190,160,.25);
}

/* MINING */

.topBar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.back {
    width: auto;
    padding: 10px 16px;
    font-size: 15px;
    background: rgba(255,255,255,.09);
    box-shadow: none;
}

.balance {
    font-size: 19px;
    font-weight: bold;
}

.miningTitle {
    margin-top: 25px;
    font-size: 25px;
    letter-spacing: 2px;
}

.miningArea {
    width: 100%;
    height: 330px;
    margin-top: 20px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.mineCrystal {
    font-size: 130px;
    filter:
        drop-shadow(0 0 12px #54eaff)
        drop-shadow(0 0 35px #267fff);
    transition: transform .12s;
    z-index: 2;
}

.hammer {
    font-size: 85px;
    position: absolute;
    right: 30px;
    bottom: 40px;
    transform: rotate(-35deg);
    z-index: 4;
    transition: transform .12s;
}

.hammer.hit {
    animation: hammerHit .22s ease;
}

@keyframes hammerHit {
    0% { transform: rotate(-35deg) translate(0,0); }
    45% { transform: rotate(-70deg) translate(-30px,-25px); }
    100% { transform: rotate(-35deg) translate(0,0); }
}

.mineCrystal.hitCrystal {
    animation: crystalHit .22s ease;
}

@keyframes crystalHit {
    0% { transform: scale(1); }
    40% { transform: scale(.87) rotate(-4deg); }
    100% { transform: scale(1); }
}

.plus {
    position: absolute;
    color: #6dffff;
    font-size: 25px;
    font-weight: 900;
    pointer-events: none;
    animation: plusUp .8s ease forwards;
    z-index: 10;
}

@keyframes plusUp {
    from {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
    to {
        opacity: 0;
        transform: translateY(-90px) scale(1.35);
    }
}

.particle {
    position: absolute;
    font-size: 18px;
    pointer-events: none;
    animation: particleFly .65s ease-out forwards;
    z-index: 8;
}

@keyframes particleFly {
    from {
        opacity: 1;
        transform: translate(0,0) scale(1);
    }
    to {
        opacity: 0;
        transform: translate(var(--x),var(--y)) scale(.3);
    }
}

.status {
    color: #8fa5c8;
    margin-top: 3px;
    font-size: 14px;
}

.progressBox {
    width: 100%;
    margin-top: 18px;
}

.progressText {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #9fb0cb;
    margin-bottom: 7px;
}

.progress {
    width: 100%;
    height: 12px;
    border-radius: 20px;
    background: #17243a;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#45eaff,#895bff);
    transition: width .25s;
}

.mineButton {
    margin-top: 22px;
}

.autoStatus {
    margin-top: 14px;
    color: #42e6c3;
    font-weight: bold;
    display: none;
}
</style>
</head>

<body>

<div class="app">

<!-- HOME -->

<div id="home" class="screen">

    <div class="logo">💎</div>

    <div class="title">CRYSTAL MINER</div>

    <div class="subtitle">
        Choose your mining method
    </div>

    <div class="bigCrystal">💎</div>

    <div class="modeButtons">

        <button id="manualBtn">
            ⛏️ EL BILEN
        </button>

        <button id="autoBtn" class="autoButton">
            🤖 AWTOMAT
        </button>

    </div>

</div>


<!-- MINING -->

<div id="mining" class="screen hidden">

    <div class="topBar">

        <button id="backBtn" class="back">
            ← YZA
        </button>

        <div class="balance">
            💎 <span id="coins">0</span>
        </div>

    </div>

    <div id="modeTitle" class="miningTitle">
        MANUAL MINING
    </div>

    <div class="miningArea" id="miningArea">

        <div id="crystal" class="mineCrystal">
            💎
        </div>

        <div id="hammer" class="hammer">
            🔨
        </div>

    </div>

    <div id="status" class="status">
        Tap the button to mine
    </div>

    <div id="autoStatus" class="autoStatus">
        🤖 MINING AUTOMATICALLY...
    </div>

    <div class="progressBox">

        <div class="progressText">
            <span>Mining progress</span>
            <span id="percent">0%</span>
        </div>

        <div class="progress">
            <div id="bar" class="bar"></div>
        </div>

    </div>

    <button id="mineBtn" class="mineButton">
        🔨 MINE
    </button>

</div>

</div>


<script>

let coins = 0;
let progress = 0;
let automatic = false;
let timer = null;

const home = document.getElementById("home");
const mining = document.getElementById("mining");
const manualBtn = document.getElementById("manualBtn");
const autoBtn = document.getElementById("autoBtn");
const backBtn = document.getElementById("backBtn");
const mineBtn = document.getElementById("mineBtn");

const crystal = document.getElementById("crystal");
const hammer = document.getElementById("hammer");
const miningArea = document.getElementById("miningArea");

const coinsText = document.getElementById("coins");
const bar = document.getElementById("bar");
const percent = document.getElementById("percent");

const modeTitle = document.getElementById("modeTitle");
const status = document.getElementById("status");
const autoStatus = document.getElementById("autoStatus");


function openMining(mode) {

    home.classList.add("hidden");
    mining.classList.remove("hidden");

    coins = 0;
    progress = 0;
    automatic = mode === "auto";

    coinsText.textContent = coins;
    bar.style.width = "0%";
    percent.textContent = "0%";

    if (automatic) {

        modeTitle.textContent = "🤖 AUTOMATIC MINING";
        status.textContent = "Mining...";

        autoStatus.style.display = "block";
        mineBtn.style.display = "none";

        timer = setInterval(mine, 850);

    } else {

        modeTitle.textContent = "⛏️ MANUAL MINING";
        status.textContent = "Tap MINE to break the crystal";

        autoStatus.style.display = "none";
        mineBtn.style.display = "block";
    }
}


function mine() {

    coins++;

    progress += 5;

    if (progress >= 100) {
        progress = 0;
    }

    coinsText.textContent = coins;

    bar.style.width = progress + "%";
    percent.textContent = progress + "%";

    hammer.classList.remove("hit");
    crystal.classList.remove("hitCrystal");

    void hammer.offsetWidth;

    hammer.classList.add("hit");
    crystal.classList.add("hitCrystal");

    createPlus();
    createParticles();

    if (!automatic) {
        status.textContent = "💥 Crystal hit! +1";
    }
}


function createPlus() {

    const plus = document.createElement("div");

    plus.className = "plus";
    plus.textContent = "+1 💎";

    plus.style.left =
        (45 + Math.random() * 15) + "%";

    plus.style.top = "40%";

    miningArea.appendChild(plus);

    setTimeout(() => {
        plus.remove();
    }, 800);
}


function createParticles() {

    const symbols = ["💎","✦","◆","•"];

    for (let i = 0; i < 6; i++) {

        const particle = document.createElement("div");

        particle.className = "particle";

        particle.textContent =
            symbols[Math.floor(Math.random() * symbols.length)];

        particle.style.left = "50%";
        particle.style.top = "45%";

        particle.style.setProperty(
            "--x",
            (Math.random() * 180 - 90) + "px"
        );

        particle.style.setProperty(
            "--y",
            (Math.random() * 150 - 80) + "px"
        );

        miningArea.appendChild(particle);

        setTimeout(() => {
            particle.remove();
        }, 700);
    }
}


function goBack() {

    clearInterval(timer);

    timer = null;
    automatic = false;

    mining.classList.add("hidden");
    home.classList.remove("hidden");
}


manualBtn.addEventListener("click", () => {
    openMining("manual");
});

autoBtn.addEventListener("click", () => {
    openMining("auto");
});

mineBtn.addEventListener("click", mine);

backBtn.addEventListener("click", goBack);


/* Telegram Mini App support */

if (window.Telegram && Telegram.WebApp) {

    Telegram.WebApp.ready();

    Telegram.WebApp.expand();

    Telegram.WebApp.BackButton.show();

    Telegram.WebApp.BackButton.onClick(goBack);
}

</script>

</body>
</html>
