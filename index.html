<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Crystal Platform</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,#172554 0,#070b18 45%,#03050b 100%);
  color:white;
  padding-bottom:85px;
}

.app{
  max-width:520px;
  margin:auto;
  padding:22px 16px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.lang{
  background:#111827;
  border:1px solid #29344d;
  border-radius:12px;
  padding:8px 11px;
  color:white;
}

.card{
  background:rgba(15,23,42,.85);
  border:1px solid #26334e;
  border-radius:22px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.balance-title{
  color:#94a3b8;
  font-size:13px;
}

.balance{
  font-size:38px;
  font-weight:800;
  margin:8px 0 20px;
}

.buttons{
  display:flex;
  gap:10px;
}

button{
  border:0;
  color:white;
  cursor:pointer;
}

.action{
  flex:1;
  padding:14px;
  border-radius:15px;
  background:#1d4ed8;
  font-weight:700;
}

.action.withdraw{
  background:#334155;
}

.section-title{
  font-size:25px;
  font-weight:800;
  margin-bottom:18px;
}

.miner-box{
  text-align:center;
  padding:25px 10px;
}

.crystal{
  font-size:75px;
  margin:10px;
}

.count{
  font-size:27px;
  font-weight:800;
}

.sub{
  color:#94a3b8;
  margin-top:7px;
}

.mine-buttons{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:25px;
}

.mine-btn{
  padding:17px;
  border-radius:17px;
  font-size:16px;
  font-weight:800;
  background:#2563eb;
}

.mine-btn.auto{
  background:#7c3aed;
}

.progress{
  height:10px;
  background:#1e293b;
  border-radius:10px;
  overflow:hidden;
  margin-top:18px;
}

.progress-fill{
  height:100%;
  width:0%;
  background:#60a5fa;
  transition:.25s;
}

.profile{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.avatar{
  width:65px;
  height:65px;
  border-radius:50%;
  background:#1e3a8a;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
}

.info{
  line-height:1.8;
}

.info span{
  color:#94a3b8;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:75px;
  background:rgba(3,7,18,.96);
  border-top:1px solid #1e293b;
  display:flex;
  justify-content:center;
  z-index:20;
}

.nav{
  width:100%;
  max-width:520px;
  display:flex;
  justify-content:space-around;
}

.nav button{
  background:none;
  color:#64748b;
  font-size:13px;
  width:33%;
}

.nav button.active{
  color:#60a5fa;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.notice{
  padding:14px;
  background:#172033;
  border-radius:14px;
  color:#cbd5e1;
  font-size:13px;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="logo">💎 CRYSTAL</div>

    <select class="lang" id="language">
      <option value="tk">🇹🇲 TM</option>
      <option value="ru">🇷🇺 RU</option>
      <option value="en">🇬🇧 EN</option>
    </select>
  </div>


  <!-- WALLET -->
  <section id="wallet" class="page active">

    <div class="card">
      <div class="balance-title" id="balanceText">
        Balance
      </div>

      <div class="balance">
        $<span id="balance">0.00</span>
      </div>

      <div class="buttons">
        <button class="action" onclick="deposit()">
          💵 <span id="depositText">Pul sal</span>
        </button>

        <button class="action withdraw" onclick="withdraw()">
          💸 <span id="withdrawText">Pul çykar</span>
        </button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">💎 Miner</div>

      <div class="miner-box">
        <div class="crystal">💎</div>

        <div class="count">
          <span id="crystals">0</span> / 100
        </div>

        <div class="sub">
          Gündelik limit
        </div>

        <div class="progress">
          <div class="progress-fill" id="progress"></div>
        </div>
      </div>
    </div>

  </section>


  <!-- MINER -->
  <section id="miner" class="page">

    <div class="section-title">💎 Miner</div>

    <div class="card">

      <div class="miner-box">

        <div class="crystal" id="bigCrystal">
          💎
        </div>

        <div class="count">
          <span id="minerCount">0</span> / 100
        </div>

        <div class="sub">
          Gündelik miner limiti
        </div>

        <div class="progress">
          <div class="progress-fill" id="minerProgress"></div>
        </div>

        <div class="mine-buttons">

          <button class="mine-btn" onclick="manualMine()">
            ⛏️ EL BILEN
          </button>

          <button class="mine-btn auto" onclick="autoMine()">
            🤖 AWTOMAT
          </button>

        </div>

        <div class="notice" id="minerNotice">
          Häzirki test režimi
        </div>

      </div>

    </div>

  </section>


  <!-- PROFILE -->
  <section id="profile" class="page">

    <div class="section-title">👤 Profil</div>

    <div class="card">

      <div class="profile">

        <div class="avatar">
          👤
        </div>

        <div class="info">
          <div><span>Ady:</span> <b id="userName">Test User</b></div>
          <div><span>Telegram ID:</span> <b id="telegramId">Test</b></div>
        </div>

      </div>

      <div class="notice">
        Profil maglumatlary indiki tapgyrda doldurylýan we saklanýan görnüşe geçiriler.
      </div>

    </div>

    <div class="card">

      <div class="section-title">🌐 Dil</div>

      <p style="color:#94a3b8">
        Dili ýokardaky menýudan üýtgedip bilersiňiz.
      </p>

    </div>

  </section>

</div>


<!-- BOTTOM NAV -->

<div class="bottom">

  <div class="nav">

    <button id="navWallet" class="active" onclick="showPage('wallet',this)">
      💰<br>
      Gapjyk
    </button>

    <button onclick="showPage('miner',this)">
      💎<br>
      Miner
    </button>

    <button onclick="showPage('profile',this)">
      👤<br>
      Profil
    </button>

  </div>

</div>


<script>

const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
}


/* TEST DATA */

let balance = 0;
let crystals = 0;
let autoTimer = null;


/* PAGE */

function showPage(page,button){

  document.querySelectorAll('.page')
    .forEach(p => p.classList.remove('active'));

  document.getElementById(page)
    .classList.add('active');

  document.querySelectorAll('.nav button')
    .forEach(b => b.classList.remove('active'));

  button.classList.add('active');
}


/* MANUAL MINER */

function manualMine(){

  if(crystals >= 100){
    document.getElementById('minerNotice').innerText =
      'Bugünlik 100 limit doldy. Ertir täzeden açylar.';
    return;
  }

  crystals++;

  updateMiner();

}


/* AUTO MINER */

function autoMine(){

  if(autoTimer){
    clearInterval(autoTimer);
    autoTimer = null;

    document.getElementById('minerNotice').innerText =
      'Awtomat duruzdy.';
    return;
  }

  if(crystals >= 100){
    document.getElementById('minerNotice').innerText =
      'Bugünlik limit doldy.';
    return;
  }

  document.getElementById('minerNotice').innerText =
    '🤖 Awtomat işleýär...';

  /*
    TEST:
    10 minut = 100 crystal
    600 sekunt / 100 = 6 sekunt
  */

  autoTimer = setInterval(() => {

    if(crystals >= 100){

      clearInterval(autoTimer);
      autoTimer = null;

      document.getElementById('minerNotice').innerText =
        '100/100 boldy. Ertir täzeden açylar.';

      return;
    }

    crystals++;

    updateMiner();

  },6000);

}


/* UPDATE */

function updateMiner(){

  document.getElementById('crystals').innerText =
    crystals;

  document.getElementById('minerCount').innerText =
    crystals;

  document.getElementById('progress').style.width =
    crystals + '%';

  document.getElementById('minerProgress').style.width =
    crystals + '%';

}


/* DEPOSIT */

function deposit(){

  alert(
    'TEST: Pul salmak bölümi. Crypto payment indiki tapgyrda goşular.'
  );

}


/* WITHDRAW */

function withdraw(){

  alert(
    'TEST: Pul çykarmak bölümi. Minimum $50 we admin tassyklamasy indiki tapgyrda goşular.'
  );

}


/* LANGUAGE */

document.getElementById('language')
.addEventListener('change',function(){

  localStorage.setItem(
    'language',
    this.value
  );

});


/* TELEGRAM USER */

if(tg && tg.initDataUnsafe && tg.initDataUnsafe.user){

  const user = tg.initDataUnsafe.user;

  document.getElementById('userName').innerText =
    ((user.first_name || '') + ' ' +
     (user.last_name || '')).trim();

  document.getElementById('telegramId').innerText =
    user.id;

}

</script>

</body>
</html>
