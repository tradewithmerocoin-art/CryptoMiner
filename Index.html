<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Crystal Miner</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 50% 20%, #263b63 0%, #101827 45%, #070b12 100%);
    color: white;
    display: flex;
    justify-content: center;
    overflow: hidden;
}

.app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    padding: 35px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.logo {
    font-size: 42px;
    margin-top: 25px;
    filter: drop-shadow(0 0 15px #5ee7ff);
}

h1 {
    margin-top: 8px;
    font-size: 30px;
    letter-spacing: 3px;
}

.subtitle {
    margin-top: 8px;
    color: #91a4c5;
    font-size: 14px;
}

.crystal {
    width: 190px;
    height: 190px;
    margin-top: 65px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 120px;
    filter: drop-shadow(0 0 25px #5ee7ff);
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.buttons {
    width: 100%;
    margin-top: 55px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

button {
    width: 100%;
    padding: 19px;
    border: none;
    border-radius: 18px;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(135deg, #2364d2, #6636d9);
    box-shadow: 0 8px 25px rgba(40, 100, 220, 0.35);
    transition: transform 0.12s;
}

button:active {
    transform: scale(0.96);
}

.auto {
    background: linear-gradient(135deg, #087f70, #16b89a);
    box-shadow: 0 8px 25px rgba(20, 190, 160, 0.3);
}

.mining {
    display: none;
    width: 100%;
    text-align: center;
}

.counter {
    margin-top: 25px;
    font-size: 28px;
    font-weight: bold;
}

.status {
    margin-top: 10px;
    color: #8da2c5;
}

.hammer {
    font-size: 90px;
    margin-top: 35px;
}

.hit {
    animation: hit 0.25s ease;
}

@keyframes hit {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(-30deg) scale(1.2); }
    100% { transform: rotate(0deg) scale(1); }
}

.progress {
    width: 100%;
    height: 12px;
    background: #172235;
    border-radius: 20px;
    margin-top: 25px;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #42e8ff, #8b5cff);
    transition: width 0.3s;
}
</style>
</head>

<body>

<div class="app">

    <div id="home">
        <div class="logo">💎</div>

        <h1>CRYSTAL MINER</h1>

        <div class="subtitle">
            Choose your mining method
        </div>

        <div class="crystal">
            💎
        </div>

        <div class="buttons">
            <button onclick="startManual()">
                ⛏️ EL BILEN
            </button>

            <button class="auto" onclick="startAuto()">
                🤖 AWTOMAT
            </button>
        </div>
    </div>


    <div class="mining" id="mining">

        <div class="logo">💎</div>

        <h1 id="modeTitle">MINING</h1>

        <div class="crystal" id="crystal">
            💎
        </div>

        <div class="hammer" id="hammer">
            🔨
        </div>

        <div class="counter">
            💎 <span id="coins">0</span>
        </div>

        <div class="status" id="status">
            Ready to mine
        </div>

        <div class="progress">
            <div class="bar" id="bar"></div>
        </div>

        <div class="buttons">
            <button id="mineButton" onclick="mine()">
                🔨 MINE
            </button>

            <button class="auto" onclick="goHome()">
                ← YZA
            </button>
        </div>

    </div>

</div>


<script>

let coins = 0;
let progress = 0;
let autoMining = false;
let autoTimer = null;

function startManual() {

    document.getElementById("home").style.display = "none";
    document.getElementById("mining").style.display = "block";

    document.getElementById("modeTitle").innerText =
        "MANUAL MINING";

    document.getElementById("status").innerText =
        "Tap MINE to break the crystal";

    document.getElementById("mineButton").style.display =
        "block";
}

function startAuto() {

    document.getElementById("home").style.display = "none";
    document.getElementById("mining").style.display = "block";

    document.getElementById("modeTitle").innerText =
        "🤖 AUTOMATIC MINING";

    document.getElementById("status").innerText =
        "Mining...";

    document.getElementById("mineButton").style.display =
        "none";

    autoMining = true;

    autoTimer = setInterval(() => {
        mine();
    }, 900);
}

function mine() {

    coins++;

    progress += 5;

    if (progress > 100) {
        progress = 0;
    }

    document.getElementById("coins").innerText =
        coins;

    document.getElementById("bar").style.width =
        progress + "%";

    const hammer =
        document.getElementById("hammer");

    hammer.classList.remove("hit");

    void hammer.offsetWidth;

    hammer.classList.add("hit");

    const crystal =
        document.getElementById("crystal");

    crystal.style.transform =
        "scale(0.9)";

    setTimeout(() => {
        crystal.style.transform =
            "scale(1)";
    }, 120);

    if (autoMining) {
        document.getElementById("status").innerText =
            "⛏️ Mining automatically...";
    } else {
        document.getElementById("status").innerText =
            "💥 Crystal hit! +1";
    }
}

function goHome() {

    clearInterval(autoTimer);

    autoMining = false;

    document.getElementById("mining").style.display =
        "none";

    document.getElementById("home").style.display =
        "block";
}

</script>

</body>
</html>
